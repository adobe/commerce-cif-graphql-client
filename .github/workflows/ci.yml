name: github-actions

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build
        run: |
          java -version
          mvn -v
          mvn -B clean install

      # Publish the Surefire JUnit results as a "Tests" check run — but ONLY when a test fails
      # (skip_success_summary + if: failure()), so a green run shows nothing. Same tool and
      # settings as core-cif-components' ci.yml and the venia test jobs.
      - name: Publish test results
        if: failure()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Tests
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          skip_success_summary: true
          fail_on_failure: false

      - name: Upload surefire reports
        if: always() && hashFiles('**/target/surefire-reports/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v6
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  # Release runs only on 'graphql-client-*' tags, after 'build' succeeds — mirrors the
  # CircleCI 'build-and-release' workflow so the project is built once, then deployed.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/graphql-client-')
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy to Maven Central
        run: mvn -B -s .github/settings.xml clean deploy -P release-sign-artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Remove GPG keyring
        if: always()
        run: rm -rf ~/.gnupg
