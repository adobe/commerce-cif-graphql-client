name: github-actions

on:
  pull_request:
  push:
    branches:
      - master
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build
        id: build
        run: .github/scripts/build.sh

      - name: Prepare test reports
        if: always()
        run: .github/scripts/prepare-test-reports.sh

      - name: Annotate test failures
        if: always() && hashFiles('build-reports/test-annotations.txt') != ''
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            echo "$line"
          done < build-reports/test-annotations.txt

      - name: Publish summary
        if: always()
        run: .github/scripts/publish-summary.sh

      - name: Upload build-reports
        id: reports
        if: always() && hashFiles('build-reports/surefire-reports/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: build-reports-java${{ matrix.java }}
          path: build-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v6
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
