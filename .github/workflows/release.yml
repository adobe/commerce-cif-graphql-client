name: release

# Triggered only by release tags committed by 'mvn release:prepare'. Because it runs
# only on these tags, it never appears on pull requests. 'mvn clean deploy' compiles,
# tests and deploys in one pass, so no separate build job is needed.
on:
  push:
    tags:
      - 'graphql-client-*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy to Maven Central
        run: mvn -B -s .github/settings.xml clean deploy -P release-sign-artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      # If a test fails during the release build, publish the same "Tests" check with the
      # failed tests, error messages and stack traces — identical to the build workflow.
      - name: Publish test results
        if: failure()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Tests
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          skip_success_summary: true
          fail_on_failure: false
